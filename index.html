<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>仕立て見積システム</title>
<style>
:root{
  --bg:#f6f4f0; --panel:#ffffff; --ink:#1f1c19; --sub:#6b635a;
  --line:#e2ddd5; --accent:#7a1f2b; --accent-soft:#f5e9ea;
  --ok:#1f6b45; --warn:#8a5a00; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit}

.bar{position:sticky;top:0;z-index:50;background:rgba(246,244,240,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;
  padding-top:calc(10px + env(safe-area-inset-top))}
.brand{font-weight:700;letter-spacing:.02em;font-size:17px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--sub);letter-spacing:.06em}
.seg{margin-left:auto;display:flex;background:#eae5dd;border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-size:15px;
  font-weight:600;color:var(--sub);cursor:pointer;position:relative;white-space:nowrap}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button .cnt{font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:0 5px;margin-left:4px}

.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 130px}

.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px;font-size:13px;color:var(--sub)}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs span.sep{opacity:.5}
.crumbs button{border:0;background:#ece7df;border-radius:999px;padding:8px 15px;font-size:14px;cursor:pointer}
.crumbs button:active{background:var(--accent-soft)}

h2.step{font-size:15px;letter-spacing:.04em;color:var(--sub);font-weight:600;margin:0 0 10px}
h2.step.mt{margin-top:22px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);min-height:64px;
  display:flex;flex-direction:column;justify-content:center;transition:transform .08s}
.tile:active{transform:scale(.975)}
.tile b{font-size:17px;font-weight:600}
.tile em{font-style:normal;font-size:12px;color:var(--sub);margin-top:3px}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card.off{opacity:.5}
.card>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;
  background:#fbfaf8;flex-wrap:wrap}
.card>header h3{margin:0;font-size:15px;font-weight:700}
.card>header .req{font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px}
.card>header .pick{margin-left:auto;font-size:13px;color:var(--sub)}
.opts{display:grid;gap:0}
.opt{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid #f0ece6;cursor:pointer;
  background:#fff;text-align:left;border-left:0;border-right:0;border-bottom:0;width:100%}
.opt:first-child{border-top:0}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #c9c2b8;flex:none;position:relative}
.opt.on .rd{border-color:var(--accent);background:var(--accent)}
.opt.on .rd:after{content:"";position:absolute;inset:5px;background:#fff;border-radius:50%}
.opt .nm{flex:1;font-size:15px}
.opt .cd{font-size:11px;color:#a49b90;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.opt .pr{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.opt.on{background:var(--accent-soft)}
.poly{font-size:10px;background:#e6f0ea;color:var(--ok);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}

.moneycard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap}
.row label{width:130px;font-size:14px;color:var(--sub);flex:none}
.fld{position:relative;flex:1;min-width:130px}
.fld input{width:100%;padding:12px 40px 12px 13px;border:1px solid var(--line);border-radius:10px;
  background:#fbfaf8;font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.fld input.txt{text-align:left;padding-right:13px}
.fld input[type=date]{text-align:left;padding-right:13px;min-height:48px}
.fld input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:#fff}
.fld input:disabled{background:#f0ece6;color:#a49b90}
.fld .unit{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px}
.hint{font-size:12px;color:var(--sub);margin:2px 0 10px}

.disc{border-top:1px solid var(--line);background:#fbfaf8;padding:12px 16px}
.disc.sub{background:#fff;border-top:1px dashed #e2ddd5;padding:10px 16px 12px}
.disc .dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.disc .dhead b{font-size:14px;font-weight:600;color:var(--sub)}
.segsm{display:flex;background:#e6e0d7;border-radius:10px;padding:3px;gap:3px}
.segsm button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-size:13px;
  font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap}
.segsm button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.segsm.tiny button{padding:5px 10px;font-size:12px}
.disc .dbody{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.disc .dbody .fld{max-width:180px}
.after{font-size:15px;font-variant-numeric:tabular-nums}
.after .was{color:var(--sub);text-decoration:line-through;margin-right:8px;font-size:13px}
.after .now{font-weight:700;font-size:19px}
.after .off{color:var(--accent);font-size:13px;margin-left:8px}
.after.sm .now{font-size:16px}

.setcard{background:#fffdf7;border:1px solid #ece2c9}
.setcard .dhead b{color:var(--warn)}

.reqline{background:#fff7e8;border-top:1px solid #f0dfb8;padding:12px 16px;display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.reqline label{font-size:14px;font-weight:600;color:var(--warn);flex:none}
.reqline .fld input{background:#fff}
.reqline.ok{background:#eef6f1;border-top-color:#cfe5d8}
.reqline.ok label{color:var(--ok)}

.tot{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:14px 16px;margin-bottom:12px}
.tline{display:flex;justify-content:space-between;padding:5px 0;font-size:15px;gap:12px}
.tline span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.tline.minus span:last-child{color:var(--accent)}
.tline.grand{border-top:2px solid var(--ink);margin-top:8px;padding-top:10px;font-size:21px;font-weight:700}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.foot-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.foot .sum{font-size:13px;color:var(--sub);line-height:1.3}
.foot .sum b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.foot .warnmsg{font-size:12px;color:var(--accent);font-weight:600}
.btn{border:0;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;
  background:var(--accent);color:#fff;white-space:nowrap}
.btn:active{opacity:.85}
.btn.ghost{background:#ece7df;color:var(--ink)}
.btn.sm{padding:10px 15px;font-size:14px}
.btn[disabled]{opacity:.4}
.spacer{flex:1}

.citem{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  margin-bottom:12px;overflow:hidden}
.citem header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fbfaf8;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.citem header b{font-size:16px}
.citem header .tag{font-size:12px;background:#ece7df;border-radius:999px;padding:2px 9px;color:var(--sub)}
.citem .body{padding:8px 16px 14px}
.dl{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px;border-bottom:1px dashed #efebe4}
.dl:last-child{border-bottom:0}
.dl .l{color:var(--sub);flex:1}
.dl .r{font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.head{color:var(--ink);font-weight:600;border-bottom:0;padding-top:8px}
.iconbtn{border:0;background:#ece7df;border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer}
.iconbtn.warn{background:#f7e3e1;color:#8a2018}
.memobox{background:#fffdf7;border:1px solid #ece2c9;border-radius:10px;padding:10px 12px;margin-top:10px;
  font-size:14px;white-space:pre-wrap}
.memobox b{display:block;font-size:12px;color:var(--warn);margin-bottom:3px}

.rec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rec .main{flex:1;min-width:200px}
.rec .main b{font-size:16px;display:block}
.rec .main em{font-style:normal;font-size:12px;color:var(--sub)}
.rec .amt{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.badge{font-size:11px;border-radius:999px;padding:2px 9px;font-weight:700;margin-right:6px}
.badge.draft{background:#eef1f6;color:#3b5170}
.badge.fixed{background:#eef6f1;color:var(--ok)}
.recbtns{display:flex;gap:6px;flex-wrap:wrap}

.center{text-align:center}
.qrbox{background:#fff;padding:18px;border-radius:var(--r);display:inline-block;box-shadow:var(--shadow);
  border:1px solid var(--line)}
.qrbox svg{display:block;width:min(74vw,340px);height:auto;image-rendering:pixelated}
.bcrow{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid #f0ece6;flex-wrap:wrap}
.bcrow .bc{flex-basis:100%;margin-top:4px}
.bcrow:first-child{border-top:0}
.bcrow .bcinfo{flex:1;min-width:150px}
.bcrow .bcinfo b{display:block;font-size:15px}
.bcrow .bcinfo em{font-style:normal;font-size:12px;color:var(--sub)}
.bcrow .bcinfo .hk{display:inline-block;background:#fff7e8;border:1px solid #f0dfb8;color:var(--warn);
  border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;margin-top:4px}
.bcrow .bcprice{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bcrow .bcprice s{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.bc{background:#fff;padding:8px 10px 5px;border:1px solid var(--line);border-radius:8px;cursor:pointer;
  display:block;max-width:100%;text-align:left}
.bc .bcin{display:inline-block;max-width:100%}
.bc svg{display:block;max-width:100%}
.bc .lbl{display:block;text-align:center;font-size:12px;letter-spacing:.16em;
  font-variant-numeric:tabular-nums;color:#333;margin-top:3px}
.bcsize{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow)}
.bcsize .lbl{font-size:13px;color:var(--sub)}
#bcZoom{position:fixed;inset:0;z-index:200;background:rgba(20,18,16,.92);display:none;
  align-items:center;justify-content:center;padding:16px}
#bcZoom .zin{background:#fff;border-radius:16px;padding:22px 20px;width:100%;max-width:1000px;text-align:center}
#bcZoom .zbar svg{width:100%;height:auto;display:block}
#bcZoom .zlbl{font-size:20px;letter-spacing:.22em;font-variant-numeric:tabular-nums;margin:10px 0 16px}

video{width:100%;max-width:460px;border-radius:var(--r);background:#000;display:block;margin:0 auto}
.scanwrap{position:relative;max-width:460px;margin:0 auto}
.scanwrap .frame{position:absolute;inset:12%;border:3px solid rgba(255,255,255,.85);border-radius:14px;pointer-events:none}
.notice{background:#fff7e8;border:1px solid #f0dfb8;color:var(--warn);border-radius:12px;padding:12px 14px;
  font-size:14px;margin-bottom:12px}
.notice.ok{background:#eef6f1;border-color:#cfe5d8;color:var(--ok)}
.err{background:#fdeceb;border-color:#f3c8c4;color:#8a2018}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:12px;
  font-size:15px;background:#fbfaf8;resize:vertical}
textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;background:#fff}
.empty{text-align:center;color:var(--sub);padding:56px 20px}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.35}
/* カレンダー */
.cal{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px 12px;max-width:420px}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead b{font-size:16px;min-width:120px;text-align:center}
.navb{border:1px solid var(--line);background:#fbfaf8;border-radius:10px;width:44px;height:40px;
  font-size:20px;line-height:1;cursor:pointer;color:var(--sub)}
.navb:active{background:#ece7df}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
.dow.sun{color:#a03028}.dow.sat{color:#2b5382}
.day{border:0;background:transparent;border-radius:10px;height:44px;font-size:16px;cursor:pointer;
  font-variant-numeric:tabular-nums}
.day:active{background:#ece7df}
.day.sun{color:#a03028}.day.sat{color:#2b5382}
.day.today{box-shadow:inset 0 0 0 2px #c9c2b8}
.day.on{background:var(--accent);color:#fff!important;font-weight:700}
.day.blank{visibility:hidden}

/* セット */
.setwrap{background:#fffdf7;border:1px solid #ece2c9;border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.setwrap h4{margin:0 0 8px;font-size:15px;color:var(--warn)}
.setrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px dashed #ece2c9}
.setrow:first-of-type{border-top:0}
.setrow .nm{flex:1;min-width:150px}
.setrow .fld{max-width:190px}
.setpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;
  cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.out{background:#fff;border-color:#d8b48a;color:#8a5a00;font-weight:600}
.chip small{opacity:.85;margin-left:5px;font-size:11px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.setsel{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.setsel .lbl{font-size:12px;color:var(--sub)}

/* 同期状態 */
.sync{font-size:11px;border-radius:999px;padding:5px 11px;font-weight:700;white-space:nowrap;
  border:0;cursor:pointer;font-family:inherit}
.sync.on{background:#eef6f1;color:var(--ok)}
.sync.off{background:#f0ece6;color:var(--sub)}
.sync.err{background:#fdeceb;color:#8a2018}
.cloudlist .rec{cursor:pointer}
.cloudlist .rec:active{background:#faf7f3}
.fresh{background:#eef6f1!important;border-color:#cfe5d8!important}
.newtag{font-size:10px;background:var(--ok);color:#fff;border-radius:999px;padding:1px 7px;margin-left:6px}

/* エラー表示 */
.errbanner{background:#fdeceb;border:2px solid #e0a29c;color:#8a2018;border-radius:12px;
  padding:14px 16px;margin-bottom:14px;font-size:15px;font-weight:600;display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.errbanner .x{margin-left:auto;background:#f7d9d6;border:0;border-radius:8px;padding:6px 12px;
  font-size:13px;cursor:pointer;color:#8a2018;font-weight:600}
.reqline.bad{animation:flash 1s ease 2;border-top-color:#cf5b5b}
@keyframes flash{0%,100%{background:#fff7e8}50%{background:#fbd5d0}}
.laterbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;
  font-size:14px;cursor:pointer;white-space:nowrap;font-weight:600}
.laterbtn.on{background:var(--warn);border-color:var(--warn);color:#fff}
.tbd{background:#fff7e8;border:1px solid #f0dfb8;color:var(--warn);border-radius:6px;
  padding:1px 8px;font-size:12px;font-weight:700}

/* ---------- ロック画面 ---------- */
#lock{position:fixed;inset:0;z-index:300;background:linear-gradient(160deg,#f0e4e6,#f6f2ec);
  display:flex;align-items:center;justify-content:center;padding:20px}
.lockcard{background:#fff;border-radius:20px;padding:34px 30px 28px;width:360px;max-width:90vw;
  box-shadow:0 12px 44px rgba(80,40,50,.18);text-align:center}
.lockcard .logo{font-size:12px;color:var(--gold,#b8975a);letter-spacing:.22em;margin-bottom:6px;color:#b8975a}
.lockcard h1{font-size:21px;margin:0 0 2px;font-weight:700}
.lockcard .sub{color:var(--sub);font-size:13px;margin-bottom:22px}
.lockcard input[type=password]{width:100%;padding:14px;font-size:18px;text-align:center;
  border:1px solid var(--line);border-radius:12px;background:#fbfaf8}
.lockcard input[type=password]:focus{outline:2px solid var(--accent);outline-offset:-1px;background:#fff}
.lockcard .pwbtn{width:100%;margin-top:12px;border:0;border-radius:12px;padding:14px;font-size:16px;
  font-weight:700;background:var(--accent);color:#fff;cursor:pointer}
.lockcard .pwbtn[disabled]{opacity:.5}
.lockerr{color:var(--accent);font-size:13px;min-height:20px;margin-top:10px;font-weight:600}
.lockchk{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:13px;color:var(--sub)}
.lockchk input{width:20px;height:20px}
.locknote{font-size:11px;color:var(--sub);margin-top:16px;line-height:1.5}
.lockbtnrow{margin-left:auto;display:flex;gap:6px}

@media print{
  .bar,.foot,.noprint,.bcsize,#bcZoom{display:none!important}
  /* 印刷時は原本PDFと同一寸法（バー部 52.2mm×7.03mm） */
  .bc svg{width:60.20mm!important;height:8.11mm!important}
  .bc{border:0;padding:0}
  body{background:#fff}
  .wrap{padding:0}
  .citem,.card,.tot{box-shadow:none;break-inside:avoid}
}
/* ---------- 商品タグ読み取り画面 ---------- */
.scanov{position:fixed;inset:0;z-index:2000;background:#1c1917;color:#fff;
  display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scanov .scanhead{display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid #3f3b38;font-size:16px}
.scanov .spacer{flex:1}
.scanstage{position:relative;background:#000;flex:1;min-height:0;overflow:hidden}
.scanstage video,.scanstage img{width:100%;height:100%;object-fit:cover;display:block}
.scanstage img{display:none}
.scanguide{position:absolute;inset:8% 6%;border:3px solid rgba(255,255,255,.92);
  border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.38);pointer-events:none}
.scanguide::after{content:attr(data-t);position:absolute;left:0;right:0;bottom:-30px;
  text-align:center;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000}
.scanmsg{padding:10px 14px;font-size:13px;color:#d6d3d1;min-height:20px}
.scanres{padding:0 14px;max-height:44vh;overflow:auto}
.scanres .sres{border-radius:12px;padding:14px;border:1px solid;background:#fff;color:#1c1917}
.scanres .sres.ok{border-color:#166534;background:#f0fdf4}
.scanres .sres.warn{border-color:#b45309;background:#fffbeb}
.scanres .sres.ng{border-color:#b91c1c;background:#fef2f2}
.scanres .k{font-size:12px;font-weight:700;color:#78716c}
.scanres .k.mt{margin-top:10px}
.scanres .k.warnk{color:#b45309}
.scanres .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;letter-spacing:.06em}
.scanres .big{font-size:34px;font-weight:800;line-height:1.2}
.scanres .sub2{font-size:16px;font-weight:700;color:#57534e}
.scanres p{font-size:13px;margin:8px 0 0;line-height:1.6}
.scanres .bdg{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;margin-left:6px}
.scanres .bdg.ok{background:#dcfce7;color:#166534}
.scanres .bdg.warn{background:#fef3c7;color:#b45309}
.scanfoot{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid #3f3b38}
.scanfoot .spacer{flex:1}
.scanfoot .btn.ghost{background:transparent;color:#fff;border-color:#57534e}
.scanfoot .btn.warnbtn{background:#b45309;border-color:#b45309;color:#fff}

/* ---------- STEP4-1 の読み取りカード ---------- */
.scanbox{padding:14px 16px}
.scanbox .lead{font-size:13px;color:var(--sub);margin:0 0 10px}
.scanbox .bigbtn{width:100%;font-size:17px;padding:16px}
.pcode{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;
  font-size:13px;color:var(--sub)}
.pcode b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;
  letter-spacing:.05em;color:var(--ink)}
.pcode .clr{font-size:12px}
.scanned{display:inline-block;font-size:11px;font-weight:700;background:#dcfce7;color:#166534;
  border-radius:999px;padding:2px 9px}

/* 最初の選択画面 */
.scanidle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#1c1917;padding:20px}
.scanidle:empty{display:none}
.idlebox{width:100%;max-width:420px;text-align:center}
.idletx{color:#e7e5e4;font-size:15px;line-height:1.8;margin-bottom:18px}
.scanov .btn.big{width:100%;font-size:17px;padding:16px;margin-bottom:10px}
.scanres .sub2.dim{color:#78716c;font-size:14px;font-weight:600}

/* 撮った写真は全体が見えるように（タップで場所を指すため） */
.scanstage img{object-fit:contain;background:#000}
.scanstage img.tappable{cursor:crosshair}
.scanmark{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;
  border:3px solid #fbbf24;box-shadow:0 0 0 2px rgba(0,0,0,.5);display:none;pointer-events:none}

</style>
</head>
<body>

<div id="lock">
  <div class="lockcard">
    <div class="logo">MK STYLE</div>
    <h1>仕立て見積システム</h1>
    <div class="sub" id="lockStore">—</div>
    <input type="password" id="pwInput" placeholder="パスワード" autocomplete="current-password"
      autocapitalize="none" spellcheck="false" onkeydown="if(event.key==='Enter')tryUnlock()">
    <button class="pwbtn" id="pwBtn" onclick="tryUnlock()">ログイン</button>
    <div class="lockerr" id="lockErr"></div>
    <label class="lockchk"><input type="checkbox" id="pwRemember" checked>この端末では次回から省略する</label>
    <div class="locknote">価格データはパスワードで暗号化されています。<br>パスワードは店舗内でのみ共有してください。</div>
  </div>
</div>

<div class="bar"><div class="bar-in">
  <div class="brand">仕立て見積<small id="brandStore">SHITATE ESTIMATE</small></div>
  <div class="seg">
    <button id="mEst" class="on" onclick="setMode('est')">見積</button>
    <button id="mSav" onclick="setMode('sav')">保存一覧<span class="cnt" id="savCnt" style="display:none"></span></button>
    <button id="mReg" onclick="setMode('reg')">レジ</button>
  </div>
  <div class="lockbtnrow"><button class="sync off" id="syncBadge" onclick="showDiag()">未接続</button>
    <button class="iconbtn" onclick="lockApp()">ロック</button></div>
</div></div>

<div class="wrap" id="app"></div>
<div class="foot" id="foot" style="display:none"><div class="foot-in" id="footIn"></div></div>
<div id="bcZoom" onclick="if(event.target.id==='bcZoom')closeBC()"></div>

/* ============================================================
   ロック解除（PBKDF2-SHA256 310,000回 → AES-GCM-256）
   パスワードはファイルのどこにも保存されていません
   ============================================================ */
const PBKDF2_ITER = 310000, LS_PW = "shitate_pw_"+STORE.code;
function b64d(s){ const b=atob(s), a=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
async function deriveKey(pw, salt){
  const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:PBKDF2_ITER,hash:"SHA-256"},
    base, {name:"AES-GCM",length:256}, false, ["decrypt"]);
}
async function decryptCatalog(pw){
  const raw=b64d(ENC), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const key=await deriveKey(pw, salt);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv}, key, ct);
  const o=JSON.parse(new TextDecoder().decode(pt));
  return Array.isArray(o) ? {cat:o, fb:null} : o;   /* 旧形式にも対応 */
}

function lockApp(){
  try{ localStorage.removeItem(LS_PW); }catch(e){}
  document.getElementById("pwInput").value="";
  document.getElementById("lockErr").textContent="";
  document.getElementById("lock").style.display="flex";
}
async function tryUnlock(){
  const el=document.getElementById("pwInput"), btn=document.getElementById("pwBtn"),
        err=document.getElementById("lockErr");
  const pw=el.value;
  if(!pw){ err.textContent="パスワードを入力してください"; return; }
  btn.disabled=true; err.textContent="確認中…";
  try{
    const o=await decryptCatalog(pw);
    CAT=o.cat; FBCFG=o.fb||null;
    if(document.getElementById("pwRemember").checked){ try{ localStorage.setItem(LS_PW,pw); }catch(e){} }
    el.value=""; err.textContent="";
    document.getElementById("lock").style.display="none";
    boot();
  }catch(e){
    err.textContent = (typeof crypto==="undefined"||!crypto.subtle)
      ? "この開き方では復号できません。https:// のURLから開いてください。"
      : "パスワードが違います";
    el.value=""; el.focus();
  }
  btn.disabled=false;
}

const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n=parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n)&&n>0?n:0; };
const isPoly = n => /ポリ/.test(n);
function jpDate(iso){
  if(!iso) return "";
  const d=new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  const w="日月火水木金土"[d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${w})`;
}
function stamp(ms){
  const d=new Date(ms), z=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}
/* 13桁コードのQR圧縮用（表示とは無関係。末尾1桁が算出可能なため8桁に短縮） */
function ean13check(c12){ let s=0; for(let i=0;i<12;i++) s+=(+c12[i])*(i%2===0?1:3); return (10-s%10)%10; }
function shortCode(c){
  if(c.length===13&&c.startsWith("0000")&&String(ean13check(c.slice(0,12)))===c[12]) return c.slice(4,12);
  return "!"+c;
}
function longCode(s){ if(s.startsWith("!")) return s.slice(1); const b="0000"+s; return b+ean13check(b); }

/* ---------- Code 39（原本PDFと同一の記号系・比率） ----------
   実測（仕立_訪問着PDF, 300dpi）:
     ナロー 3px / ワイド 6px（2:1）, 文字間ギャップ=ワイド, 左右クワイエット 16ナロー
     バー部 617px×83px = 52.2mm×7.03mm（縦横比 1:7.43）
   → 1ナロー=1ユニットとして 全幅240ユニット・高さ28ユニット                      */
const C39={'0':'NNNWWNWNN','1':'WNNWNNNNW','2':'NNWWNNNNW','3':'WNWWNNNNN','4':'NNNWWNNNW',
           '5':'WNNWWNNNN','6':'NNWWWNNNN','7':'NNNWNNWNW','8':'WNNWNNWNN','9':'NNWWNNWNN',
           '*':'NWNNWNWNN'};
const C39_N=1, C39_W=2, C39_GAP=2, C39_QZ=16, C39_H=28;
const C39_XMM = 52.2/208;            /* 原本の1ユニット幅(mm) */
function code39(data){
  const s="*"+String(data)+"*";
  let x=C39_QZ, r="";
  for(let i=0;i<s.length;i++){
    const pat=C39[s[i]];
    if(!pat) return null;
    for(let j=0;j<9;j++){
      const w=pat[j]==="W"?C39_W:C39_N;
      if(j%2===0) r+=`<rect x="${x}" y="0" width="${w}" height="${C39_H}"/>`;
      x+=w;
    }
    if(i<s.length-1) x+=C39_GAP;
  }
  return {units:x+C39_QZ, rects:r};
}
function code39svg(data, widthMM){
  const c=code39(data);
  if(!c) return `<div style="font:12px monospace">${esc(data)}</div>`;
  const w = widthMM || c.units*C39_XMM;
  const h = w*C39_H/c.units;
  return c39wrap(c, `width="${w.toFixed(2)}mm" height="${h.toFixed(2)}mm"`);
}
function code39svgFull(data){
  const c=code39(data);
  if(!c) return "";
  return c39wrap(c, `width="100%" height="auto"`);
}
function c39wrap(c, size){
  return `<svg viewBox="0 0 ${c.units} ${C39_H}" ${size} preserveAspectRatio="xMidYMid meet"
    shape-rendering="crispEdges">
    <rect width="${c.units}" height="${C39_H}" fill="#fff"/><g fill="#000">${c.rects}</g></svg>`;
}

let FB=null, FBSTATE="off", CLOUD=[], CLOUD_UNSUB=null, FBERR="", FBAUTH=false;
const DEVICE = (()=>{ try{ let d=localStorage.getItem("shitate_dev");
  if(!d){ d="D"+Math.abs((Date.now()^(performance.now()*1000|0))).toString(36).slice(-6).toUpperCase();

function setSync(state, note){
  FBSTATE=state;
  const b=document.getElementById("syncBadge"); if(!b) return;
  b.className="sync "+(state==="on"?"on":state==="err"?"err":"off");
  b.textContent = state==="on" ? "同期中" : state==="err" ? (note||"同期エラー")
    : state==="connecting" ? "接続中…" : "この端末のみ";
}
async function fbInit(){
  FBERR=""; FBAUTH=false;
  if(!FBCFG){ setSync("off"); return false; }
  setSync("connecting");
  try{
    if(window.__FB_MOCK){ FB=window.__FB_MOCK; await FB.init(FBCFG, STORE.code); FBAUTH=true; }
    else{
      const V="https://www.gstatic.com/firebasejs/10.12.5/";
      const [A,U,F]=await Promise.all([import(V+"firebase-app.js"),
        import(V+"firebase-auth.js"), import(V+"firebase-firestore.js")]);
      const app=A.initializeApp(FBCFG);
      await U.signInAnonymously(U.getAuth(app));
      FBAUTH=true;
      const db=F.getFirestore(app);
      const col=F.collection(db,"shitate",STORE.code,"estimates");
      FB={
        save: r => F.setDoc(F.doc(col,r.id), r),
        remove: id => F.deleteDoc(F.doc(col,id)),
        watch: cb => F.onSnapshot(F.query(col,F.orderBy("savedAt","desc"),F.limit(100)),
                 snap => cb(snap.docs.map(d=>d.data())),
                 e => { FBERR="読み取り: "+(e&&e.code?e.code:"")+" "+(e&&e.message?e.message:""); setSync("err","同期エラー"); })
      };
    }
    CLOUD_UNSUB = FB.watch(list=>{ CLOUD=list||[]; setSync("on");
      if(MODE==="sav"||(MODE==="reg"&&!REG)) rerender(); });
    setSync("on");
    return true;
  }catch(e){ console.warn(e);
    FBERR=(e&&e.code?e.code+" ":"")+(e&&e.message?e.message:String(e));
    setSync("err","接続できません"); return false; }
}
async function fbSave(rec){ if(!FB) return;
  try{ await FB.save(rec); }
  catch(e){ FBERR="書き込み: "+(e&&e.code?e.code:"")+" "+(e&&e.message?e.message:""); setSync("err","保存できません"); } }
async function fbRemove(id){ if(!FB) return; try{ await FB.remove(id); }catch(e){} }

/* ローカルとクラウドを突き合わせて1つの一覧にする（新しい方を採用） */
function mergedRecords(){
  const m=new Map();
  loadStore().forEach(r=>m.set(r.id,{...r,_src:"local"}));
  CLOUD.forEach(r=>{ const o=m.get(r.id);
    if(!o || (r.savedAt||0)>=(o.savedAt||0)) m.set(r.id,{...r,_src:(o?"both":"cloud")}); });
  return [...m.values()].sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
}

/* ============================================================
   計算
   line = {catIdx,itemIdx,varIdx,sel,hakkake,
           fabric, fMode,fVal, sMode,sVal, kMode,kVal,
           setOn, setVal,           // 表地＋仕立て セット価格（税込）
           kd:{グループ名:{m,v}}}   // 加工・付属の個別割引
   ============================================================ */
function applyDisc(raw, mode, val){
  const v=num(val);
  if(mode==="pct") return Math.min(raw, Math.floor(raw*Math.min(v,100)/100));
  if(mode==="yen") return Math.min(raw, Math.floor(v));
  return 0;
}
/* 要素キー：'表地' / '仕立て' / 加工グループ名
   inSet=true の要素はセット価格に含まれ、個別には計上しない          */
const isEx = (L,key) => !!(L.ex && L.ex[key]);      /* true = 別途いただく */

/* 小物：表地（＝商品代）だけの明細。内部キーは反物と同じ "表地" を使う */
function goodsDetail(L){
  const inSet = L.setIdx>=0 && SETS[L.setIdx];
  const fabricRaw=num(L.fabric);
  const fDisc=applyDisc(fabricRaw,L.fMode,L.fVal);
  const fabric=fabricRaw-fDisc;
  const bFab = !inSet || isEx(L,"表地");
  const head = bFab?fabric:0;
  return {goods:true, cat:"小物", item:(L.name||"小物"), variant:"",
    shitatePicks:[], kakoPicks:[], picks:[],
    fabricRaw,fDisc,fabric,bFab,
    shitateRaw:0,sDisc:0,shitate:0,bShi:true,
    kakoRaw:0,kLineDisc:0,kakoSub:0,kDisc:0,kako:0,
    inSet:!!inSet, setName:inSet?SETS[L.setIdx].n:"",
    head, total:head, hakkake:"", pcode:L.pcode||""};
}
function lineDetail(L){
  if(isGoods(L)) return goodsDetail(L);
  const cat=CAT[L.catIdx], item=cat.it[L.itemIdx], v=item.v[L.varIdx];
  const shitatePicks=[], kakoPicks=[];
  v.gr.forEach(g=>{
    const c=L.sel[g.g]; if(!c) return;
    const o=g.o.find(x=>x.c===c); if(!o) return;
    if(g.g==="仕立て") shitatePicks.push({group:g.g,name:o.n,code:o.c,price:o.p,disc:0,after:o.p});
    else{
      const d=(L.kd&&L.kd[g.g])||{m:"none",v:""};
      const off=applyDisc(o.p,d.m,d.v);
      kakoPicks.push({group:g.g,name:o.n,code:o.c,price:o.p,disc:off,after:o.p-off,dm:d.m,dv:d.v});
    }
  });
  const inSet = L.setIdx>=0 && SETS[L.setIdx];
  const fabricRaw=num(L.fabric);
  const shitateRaw=shitatePicks.reduce((a,b)=>a+b.price,0);
  const fDisc=applyDisc(fabricRaw,L.fMode,L.fVal);
  const sDisc=applyDisc(shitateRaw,L.sMode,L.sVal);
  const fabric=fabricRaw-fDisc, shitate=shitateRaw-sDisc;

  /* セット内かどうかで各要素に billable フラグを立てる */
  const bFab = !inSet || isEx(L,"表地");
  const bShi = !inSet || isEx(L,"仕立て");
  kakoPicks.forEach(p=>{ p.billable = !inSet || isEx(L,p.group); });

  const kakoRaw=kakoPicks.reduce((a,b)=>a+b.price,0);
  const kLineDisc=kakoPicks.reduce((a,b)=>a+b.disc,0);
  const kakoSub=kakoPicks.filter(p=>p.billable).reduce((a,b)=>a+b.after,0);
  const kDisc=applyDisc(kakoSub,L.kMode,L.kVal);
  const kako=kakoSub-kDisc;

  const head=(bFab?fabric:0)+(bShi?shitate:0);
  return {cat:cat.c,item:item.n,
    variant:(v.sh||"")+(v.sw&&v.sw!=="共通"?(v.sh?"・":"")+v.sw:""),
    shitatePicks,kakoPicks,picks:shitatePicks.concat(kakoPicks),
    fabricRaw,fDisc,fabric,bFab, shitateRaw,sDisc,shitate,bShi,
    kakoRaw,kLineDisc,kakoSub,kDisc,kako,
    inSet:!!inSet, setName:inSet?SETS[L.setIdx].n:"",
    head, total:head+kako, hakkake:L.hakkake||"", pcode:L.pcode||""};
}
const setsTotal = () => SETS.reduce((a,x)=>a+num(x.p),0);
const cartTotal = () => setsTotal() + CART.reduce((a,L)=>a+lineDetail(L).total,0);
function recTotal(r){
  const keep=SETS; SETS=r.sets||[];
  const t=(r.sets||[]).reduce((a,x)=>a+num(x.p),0)+(r.cart||[]).reduce((a,L)=>a+lineDetail(L).total,0);
  SETS=keep; return t;
}

function hasHakkake(L){

}

}

    <div class="tline"><span>加工・付属（${d.kakoPicks.length}項目）</span><span>${yen(d.kakoRaw)}</span></div>
    ${d.kLineDisc?`<div class="tline minus"><span>　各項目の割引・値引</span><span>−${yen(d.kLineDisc)}</span></div>`:""}
    ${d.kDisc?`<div class="tline minus"><span>　加工代 全体の割引・値引</span><span>−${yen(d.kDisc)}</span></div>`:""}
    <div class="tline grand"><span>仕立て上がり価格</span><span>${yen(d.total)}</span></div>
  </div>`;
}
function refreshMoney(){
  const d=lineDetail(CUR);
  const box=document.getElementById("totBox"); if(box) box.outerHTML=totalsHTML(d);
  [["f",d.fabricRaw,d.fDisc],["s",d.shitateRaw,d.sDisc],["k",d.kakoSub,d.kDisc]].forEach(([k,raw,off])=>{
    const a=document.getElementById("af_"+k);
    if(a) a.innerHTML=`<span class="was">${yen(raw)}</span><span class="now">${yen(raw-off)}</span>`
      +(off?`<span class="off">−${yen(off)}</span>`:"");
  });
  if(isGoods(CUR)){ updateFoot(d); return; }
  const v0=CAT[CUR.catIdx].it[CUR.itemIdx].v[CUR.varIdx];
  d.kakoPicks.forEach(p=>{
    const gid=v0.gr.findIndex(g=>g.g===p.group);
    const a=document.getElementById("ka_"+gid);
    if(a) a.innerHTML=`<span class="was">${yen(p.price)}</span><span class="now">${yen(p.after)}</span>`
      +(p.disc?`<span class="off">−${yen(p.disc)}</span>`:"");
  });
  updateFoot(d);
}
function updateFoot(d){
  const errs=lineErrors(CUR);
  footIn.innerHTML=`<div class="sum">この1点の合計<b>${yen(d.total)}</b>
      ${errs.length?`<div class="warnmsg">${esc(errs[0].m)}</div>`:""}</div>
    <button class="btn ghost" onclick="goBack()">${esc(backLabel())}</button>
    <div class="spacer"></div>
    <button class="btn ghost" onclick="cancelLine()">やめる</button>
    <button class="btn" onclick="commitLine()">${EDIT>=0?"変更を保存":"この内容で確定"}</button>`;
}

/* ============================================================
   STEP 0-3
   ============================================================ */
function renderBuilder(){
  if(isGoods(CUR) && STEP===3){ renderGoods(); return; }
  let h=crumbs();
  if(STEP===0){
    h+=`<h2 class="step">STEP 1　商品分類を選ぶ</h2><div class="grid">`;
    CAT.forEach((c,i)=>h+=`<button class="tile ${CUR.catIdx===i?"sel":""}" onclick="pickCat(${i})">
      <b>${esc(c.c)}</b><em>${c.it.length}品目</em></button>`);
    h+=`<button class="tile" onclick="pickGoods()"><b>小物</b><em>仕立てなし・タグを読むだけ</em></button>`;
    h+=`</div>`;
  }
  if(STEP===1){
    const c=CAT[CUR.catIdx];
    h+=`<h2 class="step">STEP 2　品目を選ぶ（${esc(c.c)}）</h2><div class="grid">`;
    c.it.forEach((it,i)=>{
      const kinds=[...new Set(it.v.map(v=>v.sw))].filter(x=>x!=="共通");
      h+=`<button class="tile ${CUR.itemIdx===i?"sel":""}" onclick="pickItem(${i})">
        <b>${esc(it.n)}</b><em>${kinds.length?esc(kinds.join("・")):"仕様区分なし"}</em></button>`;
    });
    h+=`</div>`;
  }
  if(STEP===2){
    const it=CAT[CUR.catIdx].it[CUR.itemIdx];
    h+=`<h2 class="step">STEP 3　仕立ての仕様を選ぶ（${esc(it.n)}）</h2><div class="grid">`;
    it.v.forEach((v,i)=>{
      const sh=v.sh||"—", sw=v.sw==="共通"?"標準":v.sw;
      h+=`<button class="tile ${CUR.varIdx===i?"sel":""}" onclick="pickVar(${i})">
        <b>${esc(sh==="—"?sw:sh+"・"+sw)}</b><em>${v.gr.reduce((a,g)=>a+g.o.length,0)}項目</em></button>`;
    });
    h+=`</div>`;
  }
  if(STEP===3){
    const v=CAT[CUR.catIdx].it[CUR.itemIdx].v[CUR.varIdx];
    const d=lineDetail(CUR);
    if(ERRS.length) h+=`<div class="errbanner" id="errBanner">
      <span>⚠</span><span>${ERRS.map(e=>esc(e.m)).join("<br>")}</span>
      <button class="x" onclick="ERRS=[];rerender()">閉じる</button></div>`;

    h+=`<h2 class="step">STEP 4-1　表地（商品本体）</h2>
      <div class="card">
        <div class="scanbox">
          <p class="lead">商品札のタグをカメラにかざすと、商品コードと税込価格が入ります。</p>
          <button class="btn bigbtn" onclick="scanFabric()">タグを読み取る</button>
          ${pcodeLine()}
        </div>
        <div style="padding:4px 16px">
          <div class="row"><label>表地価格（税込）</label>
            <div class="fld"><input id="fabInput" inputmode="numeric" placeholder="0" value="${esc(CUR.fabric)}"
              oninput="setFabric(this.value)"><span class="unit">円</span></div></div>
        </div>${discBlock("f","表地",d.fabricRaw,false)}</div>`;

    h+=`<h2 class="step mt">STEP 4-2　仕立て</h2>`;
    v.gr.filter(g=>g.g==="仕立て").forEach(g=>h+=groupCard(g,v.gr.indexOf(g),true));
    h+=`<div class="card">${discBlock("s","仕立代",d.shitateRaw,false)}</div>`;

    const others=v.gr.filter(g=>g.g!=="仕立て");
    if(others.length){
      h+=`<h2 class="step mt">STEP 4-3　加工・付属</h2>`;
      others.forEach(g=>h+=groupCard(g,v.gr.indexOf(g),false));
      h+=`<div class="card">${discBlock("k","加工代 全体",d.kakoSub,false)}</div>`;
    }
    h+=`<h2 class="step mt">この1点の金額</h2>`+totalsHTML(d);
    h+=`<div class="hint">％割引は円未満切り捨て。セット価格（複数点まとめ・サービス）は確定前の一覧画面で設定します。
      加工代の適用価格表：${PRICE_DATE}版</div>`;
  }
  app.innerHTML=h;
  if(STEP===3) updateFoot(lineDetail(CUR));
  else footIn.innerHTML=`${STEP>0?`<button class="btn ghost" onclick="goBack()">${esc(backLabel())}</button>`:""}
    <div class="sum">${CART.length?`確定済 ${CART.length}点`:"　"}<b>${CART.length?yen(cartTotal()):"—"}</b></div>
    <div class="spacer"></div>
    <button class="btn ghost" onclick="cancelLine()">${CART.length?"一覧に戻る":"やめる"}</button>`;
  foot.style.display="";
}

/* ---------- 商品タグの読み取り（見積画面側） ---------- */
function pcodeLine(){
  if(!CUR.pcode) return `<div class="pcode">まだ読み取っていません（手入力でも進められます）</div>`;
  return `<div class="pcode">商品コード <b>${esc(CUR.pcode)}</b>
    <span class="scanned">読み取り済み</span>
    <button class="btn ghost sm clr" onclick="clearPcode()">消す</button></div>`;
}
function clearPcode(){ CUR.pcode=""; rerender(); }
function afterScan(r){
  if(r.code) CUR.pcode=r.code;
  if(!r.manual && r.price) CUR.fabric=String(r.price);
  rerender();
  if(r.manual) setTimeout(()=>{
    const i=document.getElementById("fabInput");
    if(i){ i.focus(); try{ i.select(); }catch(e){} }
  },80);
}
function scanFabric(){ openScan("fabric", afterScan); }
function scanGoods(){ openScan("goods", afterScan); }
function pickGoods(){ CUR=newGoods(); EDIT=EDIT; STEP=3; ERRS=[]; render(); }
function setGoodsName(v){ CUR.name=v; }

function renderGoods(){
  const d=lineDetail(CUR);
  let h=crumbs();
  if(ERRS.length) h+=`<div class="errbanner" id="errBanner"><span>⚠</span>
    <span>${ERRS.map(e=>esc(e.m)).join("<br>")}</span>
    <button class="x" onclick="ERRS=[];rerender()">閉じる</button></div>`;
  h+=`<h2 class="step">小物（仕立て・加工なし）</h2>
    <div class="card">
      <div class="scanbox">
        <p class="lead">タグの<b>裏（バーコードの面）</b>→<b>表（金額の面）</b>の順に読み取ります。
          片面に両方載っているタグは1回で終わります。</p>
        <button class="btn bigbtn" onclick="scanGoods()">タグを読み取る</button>
        ${pcodeLine()}
      </div>
      <div style="padding:4px 16px">
        <div class="row"><label>品名</label>
          <div class="fld"><input class="txt" placeholder="例：帯締め（任意）" value="${esc(CUR.name||"")}"
            oninput="setGoodsName(this.value)"></div></div>
        <div class="row"><label>金額（税込）</label>
          <div class="fld"><input id="fabInput" inputmode="numeric" placeholder="0" value="${esc(CUR.fabric)}"
            oninput="setFabric(this.value)"><span class="unit">円</span></div></div>
      </div>
      ${discBlock("f","商品",d.fabricRaw,false)}
    </div>`;
  h+=`<h2 class="step mt">この1点の金額</h2>`+totalsHTML(d);
  h+=`<div class="hint">小物は仕立て・加工がないため、レジ画面には商品札のバーコードだけが並びます。</div>`;

  updateFoot(d);
  foot.style.display="";
}

function groupCard(g,gi,required){
  const cur=CUR.sel[g.g];
  const sel=cur?g.o.find(o=>o.c===cur):null;
  let h=`<div class="card"><header><h3>${esc(g.g)}</h3>
    ${required?'<span class="req">必須</span>':""}
    ${g.g==="八掛"&&cur?'<span class="req">番号必須</span>':""}
    <span class="pick">${cur?"選択中":"未選択"}</span></header><div class="opts">`;
  h+=`<button class="opt ${!cur?"on":""}" onclick="pickOpt(${gi},'')">
    <span class="rd"></span><span class="nm">選択しない</span><span class="pr">—</span></button>`;
  g.o.forEach(o=>{
    h+=`<button class="opt ${cur===o.c?"on":""}" onclick="pickOpt(${gi},'${o.c}')">
      <span class="rd"></span>
      <span class="nm">${esc(o.n)}${isPoly(o.n)?'<span class="poly">ポリ</span>':""}<br><span class="cd">${esc(o.c)}</span></span>
      <span class="pr">${yen(o.p)}</span></button>`;
  });
  h+=`</div>`;
  if(g.g==="八掛"&&cur){
    const v=String(CUR.hakkake||"").trim(), tbd=(v===HAKKAKE_TBD), ok=v!=="";
    h+=`<div class="reqline ${ok?"ok":""}" id="hkline">
      <label>八掛番号${ok?"":"（必須）"}</label>
      <div class="fld"><input class="txt" inputmode="text" enterkeyhint="done"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        placeholder="例：1325" ${tbd?"disabled":""}
        value="${tbd?"":esc(CUR.hakkake)}" oninput="setHakkake(this.value)"
        onkeydown="if(event.key==='Enter')this.blur()"></div>
      <button class="laterbtn ${tbd?"on":""}" onclick="toggleTBD()">${tbd?"✓ 後日決定":"後日決定"}</button>
      <div class="hknote" style="flex-basis:100%;font-size:12px;font-weight:400;${ok?"display:none":""}">
        番号がまだ決まっていない場合は「後日決定」を押してください。</div>
    </div>`;
  }
  if(!required && sel) h+=discLine(g.g, sel.p, gi);
  return h+`</div>`;
}

function pickCat(i){ if(CUR.catIdx!==i){CUR.catIdx=i;CUR.itemIdx=null;CUR.varIdx=null;CUR.sel={};CUR.kd={};CUR.hakkake="";} STEP=1; render(); }
function pickItem(i){
  if(CUR.itemIdx!==i){CUR.itemIdx=i;CUR.varIdx=null;CUR.sel={};CUR.kd={};CUR.hakkake="";}
  const it=CAT[CUR.catIdx].it[i];
  if(it.v.length===1){CUR.varIdx=0;STEP=3;} else STEP=2;
  render();
}
function pickVar(i){ if(CUR.varIdx!==i){CUR.varIdx=i;CUR.sel={};CUR.kd={};CUR.hakkake="";} STEP=3; render(); }
function pickOpt(gi,code){
  const g=CAT[CUR.catIdx].it[CUR.itemIdx].v[CUR.varIdx].gr[gi];
  if(code) CUR.sel[g.g]=code;
  else{ delete CUR.sel[g.g]; if(CUR.kd) delete CUR.kd[g.g]; if(g.g==="八掛") CUR.hakkake=""; }
  ERRS=[]; rerender();
}
function setFabric(v){ CUR.fabric=v; refreshFabric(); }
function refreshFabric(){
  const d=lineDetail(CUR);
  const box=document.getElementById("totBox"); if(box) box.outerHTML=totalsHTML(d);
  const a=document.getElementById("af_f");
  if(a) a.innerHTML=`<span class="was">${yen(d.fabricRaw)}</span><span class="now">${yen(d.fabric)}</span>`
    +(d.fDisc?`<span class="off">−${yen(d.fDisc)}</span>`:"");
  else{ const n=document.querySelector(".card .disc .after .now"); if(n) n.textContent=yen(d.fabricRaw); }
  updateFoot(d);
}
function setHakkake(v){
  CUR.hakkake=v; ERRS=[];
  const ok=String(v).trim()!=="";
  const r=document.getElementById("hkline");
  if(r){
    r.className="reqline"+(ok?" ok":"");
    const lb=r.querySelector("label"); if(lb) lb.textContent="八掛番号"+(ok?"":"（必須）");
    const note=r.querySelector(".hknote"); if(note) note.style.display=ok?"none":"";
  }
  const eb=document.getElementById("errBanner"); if(eb&&ok) eb.remove();
  updateFoot(lineDetail(CUR));
}
function toggleTBD(){
  CUR.hakkake = (String(CUR.hakkake||"").trim()===HAKKAKE_TBD) ? "" : HAKKAKE_TBD;
  ERRS=[]; rerender();
}
function cancelLine(){ CUR=null; EDIT=-1; STEP=4; ERRS=[]; render(); }
function commitLine(){
  const errs=lineErrors(CUR);
  if(errs.length){
    ERRS=errs; rerender();
    setTimeout(()=>{
      const t=document.getElementById(errs[0].f==="八掛"?"hkline":"errBanner");
      if(t){ t.scrollIntoView({behavior:"smooth",block:"center"}); t.classList.add("bad"); }
    },60);
    return;
  }
  ERRS=[]; if(EDIT>=0) CART[EDIT]=CUR; else CART.push(CUR);
  CUR=null; EDIT=-1; STEP=4; saveWip(); render();
}

/* ============================================================
   確認画面（最終画面）

/* ---------- 納期カレンダー ---------- */
function ymOf(iso){ return iso? iso.slice(0,7) : new Date().toISOString().slice(0,7); }
function calMove(d){
  const [y,m]=(CALYM||ymOf(DUE)).split("-").map(Number);
  const t=new Date(y,m-1+d,1);
  CALYM=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0");
  rerender();
}
function calToday(){ CALYM=new Date().toISOString().slice(0,7); rerender(); }
function setDue(iso){ DUE=iso; if(iso) CALYM=iso.slice(0,7); saveWip(); rerender(); }
function calendarHTML(){
  if(!CALYM) CALYM=ymOf(DUE);
  const [y,m]=CALYM.split("-").map(Number);
  const first=new Date(y,m-1,1), days=new Date(y,m,0).getDate(), lead=first.getDay();
  const todayISO=(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
  let g="";
  ["日","月","火","水","木","金","土"].forEach((w,i)=>g+=`<span class="dow ${i===0?"sun":i===6?"sat":""}">${w}</span>`);
  for(let i=0;i<lead;i++) g+=`<button class="day blank"></button>`;
  for(let d=1;d<=days;d++){
    const iso=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dow=new Date(y,m-1,d).getDay();
    g+=`<button class="day ${dow===0?"sun":dow===6?"sat":""} ${iso===DUE?"on":""} ${iso===todayISO?"today":""}"
      onclick="setDue('${iso}')">${d}</button>`;
  }
  return `<div class="cal">
    <div class="calhead">
      <button class="navb" onclick="calMove(-1)" aria-label="前の月">‹</button>
      <b>${y}年${m}月</b>
      <button class="navb" onclick="calMove(1)" aria-label="次の月">›</button>
      <span class="spacer"></span>
      <button class="iconbtn" onclick="calToday()">今月</button>
      <button class="iconbtn" onclick="setDue('')">クリア</button>
    </div>
    <div class="calgrid">${g}</div>
    <div class="hint" style="margin:8px 0 0">${DUE?`納期：<b style="color:var(--ink)">${esc(jpDate(DUE))}</b>`:"矢印で月を送り、日付を押すと決定します"}</div>
  </div>`;
}

/* ---------- セット価格 ---------- */
function addSet(){ SETS.push({n:"セット"+(SETS.length+1),p:""}); saveWip(); rerender(); }
function delSet(i){
  if(!confirm(`「${SETS[i].n}」を解除します。含まれていた商品は通常価格に戻ります。`)) return;
  SETS.splice(i,1);
  CART.forEach(L=>{ if(L.setIdx===i){L.setIdx=-1;L.ex={};} else if(L.setIdx>i) L.setIdx--; });
  saveWip(); rerender();
}
function setSetVal(i,v){ SETS[i].p=v; saveWip(); refreshCartTotals(); }
function setSetName(i,v){ SETS[i].n=v; saveWip(); }
function assignSet(li,si){
  CART[li].setIdx=si;
  if(si<0) CART[li].ex={}; else CART[li].ex=CART[li].ex||{};
  saveWip(); rerender();
}
function toggleEx(li,key){
  const L=CART[li]; L.ex=L.ex||{};
  if(L.ex[key]) delete L.ex[key]; else L.ex[key]=1;
  saveWip(); rerender();
}
function refreshCartTotals(){
  const g=document.getElementById("cartGrand"); if(g) g.textContent=yen(cartTotal());
  const f=footIn.querySelector(".sum b"); if(f) f.textContent=yen(cartTotal());
}
function setsHTML(){
  let h=`<div class="setwrap"><h4>セット価格（サービス・複数点まとめ可）</h4>`;
  if(!SETS.length){
    h+=`<div class="hint" style="margin:0 0 8px">「着物＋帯で税込◯◯円」「表地と仕立て込みで◯◯円」などの場合に作成します。
      作成後、各商品の「セット」欄で割り当て、セットに含めない項目は〈別途〉に切り替えてください。</div>`;
  }
  SETS.forEach((st,i)=>{
    const mem=CART.map((L,li)=>[L,li]).filter(([L])=>L.setIdx===i);
    const extra=mem.reduce((a,[L])=>a+lineDetail(L).total,0);
    h+=`<div class="setrow">
      <div class="nm"><div class="fld"><input class="txt" value="${esc(st.n)}" oninput="setSetName(${i},this.value)"></div>
        <div class="hint" style="margin:4px 0 0">対象 ${mem.length}点${extra?`　／　別途分 ${yen(extra)}`:""}</div></div>
      <div class="fld"><input inputmode="numeric" placeholder="0" value="${esc(st.p)}"
        oninput="setSetVal(${i},this.value)"><span class="unit">円</span></div>
      <button class="iconbtn warn" onclick="delSet(${i})">解除</button>
    </div>`;
  });
  h+=`<div style="margin-top:10px"><button class="btn ghost sm" onclick="addSet()">＋ セットを作る</button></div>`;
  return h+`</div>`;
}
function elemChips(li,d){
  const L=CART[li];
  const items=[];
  if(d.fabricRaw) items.push(["表地", d.goods?"商品":"表地", d.fabric]);
  if(d.shitatePicks.length) items.push(["仕立て","仕立て",d.shitate]);
  d.kakoPicks.forEach(p=>items.push([p.group,p.group,p.after]));
  return `<div class="chips">${items.map(([k,label,v])=>{
    const ex=isEx(L,k);
    return `<button class="chip ${ex?"out":"on"}" onclick="toggleEx(${li},'${esc(k)}')">${esc(label)}
      <small>${ex?"別途 "+yen(v):"セット内"}</small></button>`;
  }).join("")}</div>
  <div class="hint" style="margin:2px 0 6px">押すたびに〈セット内〉⇄〈別途いただく〉が切り替わります。</div>`;
}

/* ---------- 明細の内訳 ---------- */
function itemBody(d,L,li){
  let h="";
  const tag = ok => ok?"":`<span style="color:var(--ok)">（セット内）</span>`;
  if(d.fabricRaw||d.goods){
    h+=`<div class="dl head"><span class="l">${d.goods?"商品代":"表地"} ${tag(d.bFab)}</span><span class="r">${yen(d.fabricRaw)}</span></div>`;
    if(d.fDisc) h+=`<div class="dl"><span class="l">　割引・値引</span><span class="r">−${yen(d.fDisc)}　→　${yen(d.fabric)}</span></div>`;
  }
  if(d.pcode) h+=`<div class="dl"><span class="l">　商品コード</span><span class="r" style="font-family:ui-monospace,Menlo,monospace">${esc(d.pcode)}</span></div>`;
  if(d.goods){
    h+=`<div class="dl" style="border-top:2px solid #1f1c19;margin-top:6px;padding-top:8px;border-bottom:0">
      <span class="l" style="color:#1f1c19;font-weight:700">${d.inSet?"この商品の別途いただく分":"お売り上げ価格"}</span>
      <span class="r" style="font-weight:700;font-size:18px">${yen(d.total)}</span></div>`;
    if(li!=null && L && L.setIdx>=0) return elemChips(li,d)+h;
    return h;
  }
  h+=`<div class="dl head"><span class="l">仕立代 ${tag(d.bShi)}</span><span class="r">${yen(d.shitateRaw)}</span></div>`;
  d.shitatePicks.forEach(p=>h+=`<div class="dl"><span class="l">　${esc(p.name)}</span><span class="r">${yen(p.price)}</span></div>`);

const M2N={none:0,pct:1,yen:2}, N2M=["none","pct","yen"];
function encodeOrder(){
  return JSON.stringify({v:6,s:SLIP,sn:SERIAL,sh:STORE.name,m:MEMO,due:DUE,
    st:SETS.map(x=>[x.n,num(x.p)]),
    d:CART.map(L=>{
      if(isGoods(L)) return ["G", L.name||"", L.pcode?shortCode(L.pcode):"",
        num(L.fabric), M2N[L.fMode]||0, num(L.fVal),
        (L.setIdx==null?-1:L.setIdx), isEx(L,"表地")?1:0];
      const v=CAT[L.catIdx].it[L.itemIdx].v[L.varIdx];
      const groups=v.gr.filter(g=>L.sel[g.g]);
      const codes=groups.map(g=>shortCode(L.sel[g.g]));
      const kd=groups.map(g=>{ const d=(L.kd&&L.kd[g.g])||{m:"none",v:""};
        return d.m==="none"?0:[M2N[d.m],num(d.v)]; });
      const ex=[];
      if(isEx(L,"表地")) ex.push("F");
      if(isEx(L,"仕立て")) ex.push("S");
      groups.forEach((g,i)=>{ if(g.g!=="仕立て"&&isEx(L,g.g)) ex.push(i); });
      return [L.catIdx,L.itemIdx,L.varIdx,codes,num(L.fabric),
              M2N[L.fMode]||0,num(L.fVal), M2N[L.sMode]||0,num(L.sVal),
              M2N[L.kMode]||0,num(L.kVal), L.hakkake||"",
              (L.setIdx==null?-1:L.setIdx), ex, kd, L.pcode?shortCode(L.pcode):""];
    })});
}
function decodeOrder(txt){
  txt=String(txt).trim();
  if(txt.indexOf("%")>=0&&txt.indexOf("{")!==0){ try{ txt=decodeURIComponent(txt); }catch(e){} }
  const o=JSON.parse(txt);
  if(!o||!(o.v>=1&&o.v<=6)||!Array.isArray(o.d)) throw new Error("形式が違います");
  const lines=o.d.map(a=>{
    if(a[0]==="G"){                                   /* 小物 */
      const [,nm,pc,price,fm,fv,si,exf]=a;
      return {type:"goods", name:nm||"", pcode:pc?longCode(pc):"", sel:{}, hakkake:"",
        fabric:price, fMode:N2M[fm]||"none", fVal:fv,
        sMode:"none",sVal:"",kMode:"none",kVal:"",
        setIdx:(typeof si==="number"?si:-1), ex:(exf?{"表地":1}:{}), kd:{}};
    }
    const [ci,ii,vi,codes,fab]=a;
    const v=CAT[ci].it[ii].v[vi], sel={}, order=[];
    codes.map(longCode).forEach(c=>{ const g=v.gr.find(g=>g.o.some(x=>x.c===c)); if(g){ sel[g.g]=c; order.push(g.g);} });
    if(o.v===1){
      const [,,,,,fp,fy,sp,sy]=a;
      return {catIdx:ci,itemIdx:ii,varIdx:vi,sel,kd:{},ex:{},setIdx:-1,hakkake:"",fabric:fab,
        fMode:fp?"pct":(fy?"yen":"none"),fVal:fp||fy,sMode:sp?"pct":(sy?"yen":"none"),sVal:sp||sy,
        kMode:"none",kVal:""};
    }
    const [,,,,,fm,fv,sm,sv,km,kv,hk,x12,x13,x14,x15]=a;
    let kd={}, ex={}, setIdx=-1;
    if(o.v>=4){
      setIdx=(typeof x12==="number")?x12:-1;
      (Array.isArray(x13)?x13:[]).forEach(k=>{
        if(k==="F") ex["表地"]=1; else if(k==="S") ex["仕立て"]=1;
        else if(order[k]) ex[order[k]]=1;
      });
      (Array.isArray(x14)?x14:[]).forEach((y,i)=>{ if(y&&order[i]) kd[order[i]]={m:N2M[y[0]],v:y[1]}; });
    }else{ /* v3 */
      (Array.isArray(x14)?x14:[]).forEach((y,i)=>{ if(y&&order[i]) kd[order[i]]={m:N2M[y[0]],v:y[1]}; });
    }
    return {catIdx:ci,itemIdx:ii,varIdx:vi,sel,kd,ex,setIdx,hakkake:hk||"",fabric:fab,
      pcode:(typeof x15==="string"&&x15)?longCode(x15):"",
      fMode:N2M[fm]||"none",fVal:fv,sMode:N2M[sm]||"none",sVal:sv,kMode:N2M[km]||"none",kVal:kv};
  });
  return {slip:o.s||"",serial:o.sn||"",store:o.sh||"",memo:o.m||"",due:o.due||"",
          sets:(o.st||[]).map(x=>({n:x[0],p:x[1]})), lines};
}
function qrsvg(text){
  let q=null;
  for(let t=4;t<=40;t++){ try{ const c=qrcode(t,"M"); c.addData(text,"Byte"); c.make(); q=c; break; }catch(e){} }
  if(!q) return "<div>データが大きすぎます</div>";
  const n=q.getModuleCount(),m=4,s=n+m*2; let r="";
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(q.isDark(y,x)) r+=`<rect x="${x+m}" y="${y+m}" width="1" height="1"/>`;
  return `<svg viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="#fff"/><g fill="#000">${r}</g></svg>`;
}

  const txt=encodeOrder(), qtxt=encodeURIComponent(txt);

    <div class="card" style="margin-top:20px"><header><h3>読み取れないときは、この文字列をコピーして貼り付け</h3></header>
      <div style="padding:14px"><textarea class="mono" readonly onclick="this.select()">${esc(txt)}</textarea></div></div>`;
  footIn.innerHTML=`<div class="sum">合計（税込）<b>${yen(cartTotal())}</b></div>

/* ============================================================
   商品タグの読み取り（バーコード＝EAN-13 ／ 金額＝文字認識）
   ・バーコードには金額が入っていないため、金額は印字文字から読む
   ・タグには「税込」と「本体」が並ぶので、税込＝本体×1.1 が
     成り立った時だけ「確定」扱いにする（誤読がそのまま通らない）
   ============================================================ */

/* ---------- EAN-13 の描画（レジ画面で商品札のバーコードを出す） ---------- */
const EAN_L={0:"0001101",1:"0011001",2:"0010011",3:"0111101",4:"0100011",
             5:"0110001",6:"0101111",7:"0111011",8:"0110111",9:"0001011"};
const EAN_G={0:"0100111",1:"0110011",2:"0011011",3:"0100001",4:"0011101",
             5:"0111001",6:"0000101",7:"0010001",8:"0001001",9:"0010111"};
const EAN_R={0:"1110010",1:"1100110",2:"1101100",3:"1000010",4:"1011100",
             5:"1001110",6:"1010000",7:"1000100",8:"1001000",9:"1110100"};
const EAN_PAR=["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG",
               "LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function isEan13(c){
  return /^\d{13}$/.test(c) && String(ean13check(c.slice(0,12)))===c[12];
}
function ean13bits(code){
  if(!isEan13(code)) return null;
  const par=EAN_PAR[+code[0]];
  let b="101";
  for(let i=1;i<=6;i++) b+=(par[i-1]==="L"?EAN_L:EAN_G)[+code[i]];
  b+="01010";
  for(let i=7;i<=12;i++) b+=EAN_R[+code[i]];
  return b+"101";
}
/* モジュール幅0.33mm＝規格の標準寸。画面表示なので倍率をかける */
const EAN_XMM=0.33, EAN_H=64, EAN_GH=70, EAN_QZ=9;
function ean13svg(code, widthMM){
  const bits=ean13bits(code); if(!bits) return "";
  const W=bits.length+EAN_QZ*2;
  const guard=i=>(i<3)||(i>=45&&i<50)||(i>=92);
  let r="";
  for(let i=0;i<bits.length;i++) if(bits[i]==="1")
    r+=`<rect x="${i+EAN_QZ}" y="0" width="1" height="${guard(i)?EAN_GH:EAN_H}"/>`;
  const w=widthMM||W*EAN_XMM, h=w*EAN_GH/W;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${EAN_GH}" width="${w.toFixed(2)}mm" height="${h.toFixed(2)}mm"
    preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges">
    <rect width="${W}" height="${EAN_GH}" fill="#fff"/><g fill="#000">${r}</g></svg>`;
}
function ean13svgFull(code){
  const bits=ean13bits(code); if(!bits) return "";
  const W=bits.length+EAN_QZ*2;
  const guard=i=>(i<3)||(i>=45&&i<50)||(i>=92);
  let r="";
  for(let i=0;i<bits.length;i++) if(bits[i]==="1")
    r+=`<rect x="${i+EAN_QZ}" y="0" width="1" height="${guard(i)?EAN_GH:EAN_H}"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${EAN_GH}" width="100%" height="auto"
    preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges">
    <rect width="${W}" height="${EAN_GH}" fill="#fff"/><g fill="#000">${r}</g></svg>`;
}
const EAN_BASE=(95+EAN_QZ*2)*EAN_XMM;
function productBarcodeBlock(code){
  if(!isEan13(code)) return "";
  return `<button class="bc" onclick="zoomEAN('${esc(code)}')" title="押すと拡大">
    <span class="bcin">${ean13svg(code, EAN_BASE*BCSCALE)}<span class="lbl">${esc(code)}</span></span></button>`;
}
function zoomEAN(code){
  const o=document.getElementById("bcZoom");
  o.innerHTML=`<div class="zin"><div class="zbar">${ean13svgFull(code)}</div>
    <div class="zlbl">${esc(code)}</div>
    <button class="btn ghost" onclick="closeBC()">閉じる</button></div>`;
  o.style.display="flex";
}

/* ---------- 金額の取り出し ---------- */
function scanNumbers(text){
  const re=/\d{1,3}(?:[ ]?[,.][ ]?\d{3})+/g; let m; const ns=[];
  while((m=re.exec(text))!==null){
    const n=parseInt(m[0].replace(/\D/g,""),10);
    if(n>=1000&&n<=99999999&&ns.indexOf(n)<0) ns.push(n);
  }
  return ns;
}
function pickPrices(text){
  const ns=scanNumbers(text);
  let pair=null;
  for(let i=0;i<ns.length;i++) for(let j=0;j<ns.length;j++){
    if(i===j) continue;
    const hon=ns[i], zei=ns[j];
    if(zei===Math.round(hon*1.1)&&hon%100===0){ if(!pair||zei>pair.zei) pair={hon,zei}; }
  }
  /* 1つしか読めない場合は検算できないため、金額は出さない（推測は危険） */
  return {pair, all:ns};
}

/* ---------- 文字認識（tesseract）— ocrフォルダが無ければ自動的に手入力へ ---------- */
let OCRW=null, OCRP=null;
function ocrInit(){
  if(OCRP) return OCRP;
  if(typeof Tesseract==="undefined")
    return OCRP=Promise.reject(new Error("金額読み取りの部品が見つかりません"));
  OCRP=Tesseract.createWorker("eng",1,{
    workerPath:"ocr/worker.min.js", corePath:"ocr/", langPath:"ocr/", gzip:true,
    logger:m=>{ if(m.status&&SCANST.on&&SCANST.stage==="ocr") scanMsg("金額読み取りの準備中…"); }
  }).then(w=>{ OCRW=w; return w.setParameters({
      tessedit_char_whitelist:"0123456789,.", tessedit_pageseg_mode:"6",
      preserve_interword_spaces:"1"}); }).then(()=>OCRW);
  return OCRP;
}
function cvRotate(c,deg){
  if(!deg) return c;
  const o=document.createElement("canvas");
  if(deg===90||deg===270){o.width=c.height;o.height=c.width;} else {o.width=c.width;o.height=c.height;}
  const x=o.getContext("2d");
  x.translate(o.width/2,o.height/2); x.rotate(deg*Math.PI/180); x.drawImage(c,-c.width/2,-c.height/2);
  return o;
}
/* 文字認識に渡す画像の上限。これを超えると急激に遅くなるので必ず抑える */
const OCR_MAX_PX=2600;
function cvScale(c,s){
  const long=Math.max(c.width,c.height);
  let k=s;
  if(long*k>OCR_MAX_PX) k=OCR_MAX_PX/long;
  if(Math.abs(k-1)<0.02) return c;
  const o=document.createElement("canvas");
  o.width=Math.max(1,Math.round(c.width*k)); o.height=Math.max(1,Math.round(c.height*k));
  const x=o.getContext("2d"); x.imageSmoothingQuality="high";
  x.drawImage(c,0,0,o.width,o.height);
  return o;
}
const OCR_QUICK=[{s:1,p:6}];                       /* 自動：全体をざっと1通り */
const OCR_TAP=[{s:2,p:6},{s:2,p:11},{s:3,p:6}];    /* タップ後：狭い範囲を丁寧に */
const OCR_BUDGET=14000;
/* firstAngle … バーコードが見つかった向き。そこから試すと1回で当たりやすい。
   見つからなくても、必ず4方向すべてを試す（タグが横倒しでも読めるように）。 */
function ocrPrices(cv, firstAngle, passes){
  const angles=[]; [firstAngle|0,0,90,270,180].forEach(a=>{ if(angles.indexOf(a)<0) angles.push(a); });
  const jobs=[];
  (passes||OCR_QUICK).forEach(P=>angles.forEach(r=>jobs.push({r,s:P.s,p:P.p})));
  const texts=[]; const t0=Date.now(); const seen={};
  const done=()=>{ const t=texts.join("\n"); return {text:t, prices:pickPrices(t), ms:Date.now()-t0}; };
  const step=i=>{
    if(i>=jobs.length||Date.now()-t0>OCR_BUDGET) return Promise.resolve(done());
    const j=jobs[i];
    const img=cvScale(cvRotate(cv,j.r),j.s);
    const key=j.r+"/"+j.p+"/"+img.width+"x"+img.height;
    if(seen[key]) return step(i+1);          /* 上限で同じ大きさになったパスは飛ばす */
    seen[key]=1;
    scanMsg("金額を読み取っています…（"+(i+1)+"/"+jobs.length+"）");
    return ocrInit()
      .then(w=>w.setParameters({tessedit_pageseg_mode:String(j.p)}).then(()=>w.recognize(img)))
      .then(r=>{
        texts.push((r.data.text||"").replace(/\s+/g," ").trim());
        return pickPrices(texts.join("\n")).pair ? done() : step(i+1);
      })
      .catch(e=>{ if(i===0&&/部品|Tesseract|worker/i.test(e.message)) throw e; return step(i+1); });
  };
  return step(0);
}

/* ---------- 読み取り画面 ----------
   ・「撮影して読み取る」＝ 端末のカメラで1枚撮る。解像度が高く、いちばん確実。
   ・「かざして読む」    ＝ 映像から自動で探す。速いが、暗所や小さい字には弱い。
   どちらの経路でも、金額は「税込＝本体×1.1」が成り立った時だけ確定にする。
   成り立たない時は金額を出さず、手入力に回す（推測した金額は表示しない）。  */
const SCANST={on:false, mode:"fabric", stage:"idle", reader:null, stream:null, timer:null,
              code:"", price:null, hon:null, raw:"", onOK:null, shots:0, img:null};
function scanMsg(s){ const e=document.getElementById("scanMsg"); if(e) e.textContent=s; }

function scanBeep(){
  try{ const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
    const c=new A(), o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.value=1180; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(.001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);
    o.start(); o.stop(c.currentTime+.18);
  }catch(e){}
}


/* ---------- バーコード読み取りの土台 ---------- */
function scanHints(){
  const H=new Map();
  /* UPC-A を外す。先頭0のEAN-13が12桁に化けるため */
  H.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,
    ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39]);
  H.set(ZXing.DecodeHintType.TRY_HARDER,true);
  return H;
}
function scanReader(){
  if(SCANST.reader) return SCANST.reader;
  return SCANST.reader=new ZXing.BrowserMultiFormatReader(scanHints(),150);
}
/* 12桁で返ってきたら、タグに印字された13桁の形に戻す */
function normCode(code,fmt){
  return ((fmt==="UPC_A"||fmt==="UPC-A") && /^\d{12}$/.test(code)) ? "0"+code : code;
}
/* ZXingの「映像から読む」機能は1フレームおきに白黒反転をかけ、商品札のような
   通常のバーコードを取りこぼす。映像も静止画と同じ（反転しない）経路で読む。 */
let MFR=null;
function mfReader(){
  if(MFR) return MFR;
  MFR=new ZXing.MultiFormatReader(); MFR.setHints(scanHints());
  return MFR;
}
function decodeCanvas(cv){
  try{
    const src=new ZXing.HTMLCanvasElementLuminanceSource(cv);
    const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
    const r=mfReader().decodeWithState(bmp);
    const f=ZXing.BarcodeFormat[r.getBarcodeFormat()];
    return {code:normCode(r.getText(),f), fmt:f};
  }catch(e){ return null; }
}

function openScan(mode, onOK){

/* ---------- 撮影して読み取る ---------- */
function scanPickFile(){
  let inp=document.getElementById("scanFile");
  if(!inp){
    inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
    inp.setAttribute("capture","environment");
    inp.id="scanFile"; inp.style.display="none";
    inp.onchange=function(){ if(this.files&&this.files[0]) scanFromFile(this.files[0]); this.value=""; };
    document.body.appendChild(inp);
  }
  inp.click();
}
function scanFromFile(file){
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{
    /* 写真は解像度が高い。文字認識に効く範囲で縮小する */
    const cv=document.createElement("canvas");
    const s=Math.min(1, 1600/Math.max(img.width,img.height));
    cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);
    scanShowImage(cv);
    scanAnalyse(cv, img.width+"×"+img.height);
  };
  img.onerror=()=>{ scanMsg("写真を読み込めませんでした。"); };
  img.src=url;
}

  g.style.display=""; g.dataset.t="タグを枠に合わせる";
  scanSet("scanFoot",
    `<button class="btn" onclick="scanPickFile()">撮影して読む</button>
     <div class="spacer"></div>
     <button class="btn ghost" onclick="scanIdle()">やめる</button>`);
  scanMsg("かざしてください（探しています）");
  navigator.mediaDevices.getUserMedia({audio:false,video:{
      facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1440}}})
    .then(st=>{
      SCANST.stream=st;
      vid.setAttribute("playsinline",""); vid.muted=true; vid.srcObject=st;
      return vid.play().catch(()=>{});
    })
    .then(()=>scanLoop(0))
    .catch(e=>{
      scanMsg("カメラを開けませんでした（"+e.name+"）。「撮影して読む」をお使いください。");
      scanSet("scanFoot",`<button class="btn" onclick="scanPickFile()">撮影して読む</button>
        <div class="spacer"></div><button class="btn ghost" onclick="scanManual()">手入力にする</button>`);
    });
}
let SCAN_CV=null;
function scanLoop(n){
  if(!SCANST.on || SCANST.stage!=="cam") return;
  const vid=document.getElementById("scanVid");
  if(vid && vid.videoWidth>0){
    if(!SCAN_CV) SCAN_CV=document.createElement("canvas");
    SCAN_CV.width=vid.videoWidth; SCAN_CV.height=vid.videoHeight;
    SCAN_CV.getContext("2d",{willReadFrequently:true})
      .drawImage(vid,0,0,SCAN_CV.width,SCAN_CV.height);
    let hit=decodeCanvas(SCAN_CV);
    if(!hit && n%3===1) hit=decodeCanvas(cvRotate(SCAN_CV,90));
    if(!hit && n%3===2) hit=decodeCanvas(cvRotate(SCAN_CV,270));
    if(hit){
      scanBeep();
      const g=grabScan();
      scanShowImage(g.full);
      scanStop();
      SCANST.code=hit.code;
      scanAnalyse(g.roi, "映像 "+SCAN_CV.width+"×"+SCAN_CV.height);
      return;
    }
    if(n===16) scanMsg("見つかりません。「撮影して読む」のほうが確実です。");
  }
  SCANST.timer=setTimeout(()=>scanLoop(n+1), 220);
}
function grabScan(){
  const vid=document.getElementById("scanVid"), stage=document.getElementById("scanStage");
  const vw=vid.videoWidth, vh=vid.videoHeight;
  const full=document.createElement("canvas"); full.width=vw; full.height=vh;
  full.getContext("2d").drawImage(vid,0,0,vw,vh);
  let roi=full;
  try{
    const sw=stage.clientWidth, sh=stage.clientHeight;
    const k=Math.max(sw/vw, sh/vh), ox=(vw*k-sw)/2, oy=(vh*k-sh)/2;
    let gx=(0.06*sw+ox)/k, gy=(0.08*sh+oy)/k, gw=(0.88*sw)/k, gh=(0.84*sh)/k;
    gx=Math.max(0,gx); gy=Math.max(0,gy); gw=Math.min(vw-gx,gw); gh=Math.min(vh-gy,gh);
    if(gw>80&&gh>80){
      roi=document.createElement("canvas");
      roi.width=Math.round(gw); roi.height=Math.round(gh);
      roi.getContext("2d").drawImage(full,Math.round(gx),Math.round(gy),roi.width,roi.height,
        0,0,roi.width,roi.height);
    }
  }catch(e){}
  return {full,roi};
}
function scanShowImage(cv){
  const vid=document.getElementById("scanVid"), shot=document.getElementById("scanShot");
  scanSet("scanIdle","");
  document.getElementById("scanGuide").style.display="none";
  shot.src=cv.toDataURL("image/jpeg",0.85);
  shot.style.display="block"; vid.style.display="none";
}

/* ---------- 解析 ---------- */
function scanAnalyse(cv, note){
  SCANST.stage="ocr"; SCANST.shots++; SCANST.img=cv;
  scanSet("scanFoot",`<div class="spacer"></div><button class="btn ghost" onclick="scanManual()">手入力にする</button>`);
  scanMsg("読み取っています…");
  /* この写真にバーコードがあれば拾う（まだ無い場合） */
  const findCode = SCANST.code ? Promise.resolve(null) : (()=> {
    const angles=[0,90,270,180];
    const step=i=>{
      if(i>=angles.length) return Promise.resolve(null);
      const hit=decodeCanvas(cvRotate(cv,angles[i]));
      return hit?Promise.resolve(hit):Promise.resolve().then(()=>step(i+1));
    };
    return step(0);
  })();
  findCode.then(hit=>{
    if(hit) SCANST.code=hit.code;
    return (SCANST.price==null) ? ocrPrices(cv,0,OCR_QUICK) : null;
  }).then(r=>{
    if(r){
      SCANST.raw=r.text;
      if(r.prices.pair){ SCANST.price=r.prices.pair.zei; SCANST.hon=r.prices.pair.hon; }
      SCANST.cands=r.prices.all||[];
    }
    scanResult(note);
  }).catch(e=>{
    SCANST.cands=[];
    scanMsg("金額の自動読み取りは使えません（"+e.message+"）");
    scanResult(note);
  });
}

function scanResult(note){
  const okCode=!!SCANST.code, okPrice=SCANST.price!=null;
  if(!okPrice && SCANST.img){ scanTapAsk(); return; }   /* 金額はタップで確実に読む */
  SCANST.stage="done";
  let h=scanHave(), foot="";
  if(okCode&&okPrice){
    foot=`<button class="btn ghost" onclick="scanIdle()">撮り直す</button><div class="spacer"></div>
      <button class="btn ghost" onclick="scanManual()">手入力にする</button>
      <button class="btn" onclick="scanAccept()">この内容で入力</button>`;
    scanMsg("読み取れました。タグの表示と合っているかご確認ください。");
  }else{
    h+=`<div class="sres ng"><div class="k warnk">バーコードを読み取れませんでした</div>
      <p>もう一度撮るか、手入力にしてください。</p></div>`;
    foot=`<button class="btn" onclick="scanIdle()">もう一度撮る</button><div class="spacer"></div>
      <button class="btn ghost" onclick="scanManual()">手入力にする</button>`;
  }
  scanSet("scanRes",h); scanSet("scanFoot",foot);
}

/* ---------- 金額はタップで場所を教えてもらう ---------- */
function scanTapAsk(){
  SCANST.stage="tap";
  const shot=document.getElementById("scanShot");
  shot.classList.add("tappable");
  shot.onclick=scanTapped;
  scanSet("scanRes", scanHave()+
    `<div class="sres warn"><div class="k warnk">金額の場所を教えてください</div>
      <p>上の写真の<b>金額が書いてある行を指でタップ</b>してください。<br>
        その部分だけを拡大して読み取ります（税込と本体の両方が入るように）。</p></div>`);
  scanSet("scanFoot",
    `<button class="btn ghost" onclick="scanIdle()">撮り直す</button><div class="spacer"></div>
     <button class="btn ghost" onclick="scanManual()">手入力にする</button>`);
  scanMsg("金額の行をタップしてください");
}
function scanTapped(ev){
  if(SCANST.stage!=="tap") return;
  const shot=document.getElementById("scanShot"), cv=SCANST.img;
  if(!cv) return;
  const r=shot.getBoundingClientRect();
  const k=Math.min(r.width/cv.width, r.height/cv.height);   /* object-fit:contain */
  const dw=cv.width*k, dh=cv.height*k;
  const px=((ev.clientX-r.left)-(r.width-dw)/2)/k;
  const py=((ev.clientY-r.top )-(r.height-dh)/2)/k;
  if(px<0||py<0||px>cv.width||py>cv.height) return;
  const mk=document.getElementById("scanMark");
  if(mk){ mk.style.display="block";
    mk.style.left=((r.width-dw)/2+px*k)+"px"; mk.style.top=((r.height-dh)/2+py*k)+"px"; }
  scanTapAt(px/cv.width, py/cv.height);
}
/* nx,ny は写真に対する割合（0〜1）。その周りだけを切り出して読む。 */
function scanTapAt(nx,ny){
  const cv=SCANST.img; if(!cv) return;
  const shot=document.getElementById("scanShot");
  SCANST.stage="ocr";
  shot.onclick=null; shot.classList.remove("tappable");
  scanMsg("その周りを読み取っています…");
  scanSet("scanFoot",`<div class="spacer"></div><button class="btn ghost" onclick="scanManual()">手入力にする</button>`);
  const side=Math.round(Math.max(cv.width,cv.height)*0.50);
  const w=Math.min(side,cv.width), h=Math.min(side,cv.height);
  let x=Math.round(nx*cv.width-w/2), y=Math.round(ny*cv.height-h/2);
  x=Math.max(0,Math.min(cv.width-w,x)); y=Math.max(0,Math.min(cv.height-h,y));
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(cv,x,y,w,h,0,0,w,h);
  SCANST.tapCrop=c.width+"x"+c.height+"@"+x+","+y;
  ocrPrices(c,0,OCR_TAP).then(r2=>{
    SCANST.raw=r2.text;
    if(r2.prices.pair){ SCANST.price=r2.prices.pair.zei; SCANST.hon=r2.prices.pair.hon;
      scanResultFinal(); }
    else scanTapRetry(r2.prices.all||[]);
  }).catch(()=>scanTapRetry([]));
}
function scanResultFinal(){
  SCANST.stage="done";
  scanSet("scanRes", scanHave());
  scanSet("scanFoot",
    `<button class="btn ghost" onclick="scanIdle()">撮り直す</button><div class="spacer"></div>
     <button class="btn ghost" onclick="scanManual()">手入力にする</button>
     <button class="btn" onclick="scanAccept()">この内容で入力</button>`);
  scanMsg("読み取れました。タグの表示と合っているかご確認ください。");
}
function scanTapRetry(cands){
  const mk=document.getElementById("scanMark"); if(mk) mk.style.display="none";
  SCANST.stage="tap";
  const shot=document.getElementById("scanShot");
  shot.classList.add("tappable"); shot.onclick=scanTapped;
  const c=cands.length?`<div class="sub2 dim">拾えた数字：${cands.map(n=>n.toLocaleString()).join(" ／ ")}</div>`:"";
  scanSet("scanRes", scanHave()+
    `<div class="sres ng"><div class="k warnk">その場所では読み取れませんでした</div>${c}
      <p>金額の行の<b>まん中あたり</b>をもう一度タップしてみてください。<br>
        税込と本体の2行が両方入る位置だと読み取れます。うまくいかなければ手入力にしてください。</p></div>`);
  scanMsg("もう一度タップしてください");
}

function scanAccept(){
  const cb=SCANST.onOK, code=SCANST.code, price=SCANST.price||0;
  closeScan();
  if(cb) cb({code, price, manual:false});
}
function scanManual(){
  const cb=SCANST.onOK, code=SCANST.code;
  closeScan();
  if(cb) cb({code, price:0, manual:true});
}

/* ============================================================
   起動：前回の入力があれば復元
   ============================================================ */
function boot(){
  document.getElementById("brandStore").textContent=STORE.name;
  MEM=loadStore();
  const w=lsGet(WIP_KEY);
  if(w){ try{
    const o=JSON.parse(w);
    if(o&&o.cart&&o.cart.length){
      CART=o.cart; CART.forEach(L=>{L.kd=L.kd||{};L.ex=L.ex||{};if(L.setIdx==null)L.setIdx=-1;});
      SETS=o.sets||[];
      SERIAL=o.serial||""; SLIP=o.slip||""; MEMO=o.memo||""; DUE=o.due||""; CALYM=(o.due||"").slice(0,7); CUR_ID=o.id||"";
      FLASH="前回の入力内容を復元しました。";
    }
  }catch(e){} }
  render();
  fbInit();
}
/* 起動：記憶済みパスワードがあれば自動解錠 */
(async function start(){
  document.getElementById("lockStore").textContent=STORE.name;
  let saved=null; try{ saved=localStorage.getItem(LS_PW); }catch(e){}
  if(saved){
    try{ const o=await decryptCatalog(saved); CAT=o.cat; FBCFG=o.fb||null;
         document.getElementById("lock").style.display="none"; boot(); return; }
    catch(e){ try{ localStorage.removeItem(LS_PW); }catch(e2){} }
  }
  document.getElementById("pwInput").focus();
})();
</script>
